<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('ログイン')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="form-page">
  <h1>ログイン</h1>

  <p class="msg ok" th:if="${param.registered}">会員登録が完了しました。ログインしてください。</p>
  <p class="msg ng" th:if="${param.error}">メールアドレスまたはパスワードが正しくありません。</p>
  <p class="msg ok" th:if="${param.logout}">ログアウトしました。</p>

  <form th:action="@{/login}" method="post">
    <label>メールアドレス
      <input type="email" name="username" required autofocus>
    </label>
    <label>パスワード
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn">ログイン</button>
  </form>
  <p>会員登録がまだの方は <a th:href="@{/register}">こちら</a></p>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
