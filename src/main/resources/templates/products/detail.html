<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${product.name})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="container detail">
  <img th:src="${product.imagePath != null} ? @{${product.imagePath}} : @{/images/noimage.svg}"
       th:alt="${product.name}">
  <div>
    <p><a th:href="@{/products}">← 商品一覧へ戻る</a></p>
    <h1 th:text="${product.name}"></h1>
    <div class="cat" th:text="${product.categoryName}"></div>
    <div class="price big" th:text="'¥' + ${#numbers.formatInteger(product.price, 3, 'COMMA')}"></div>
    <p class="desc" th:text="${product.description}"></p>
    <div class="stock" th:text="${product.stock > 0} ? '在庫あり（残り' + ${product.stock} + '）' : '在庫切れ'"
         th:classappend="${product.stock == 0} ? 'out'"></div>

    <!-- ログイン中で在庫があるとき：カートに入れるフォーム -->
    <form th:action="@{/cart/add}" method="post"
          th:if="${product.stock > 0 and loginName != null}">
      <input type="hidden" name="productId" th:value="${product.id}">
      <label>数量
        <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
      </label>
      <button type="submit" class="btn">カートに入れる</button>
    </form>

    <!-- 未ログインで在庫があるとき：ログインを促す -->
    <p th:if="${product.stock > 0 and loginName == null}">
      <a th:href="@{/login}">ログイン</a>すると、カートに入れられます。
    </p>

    <!-- 在庫切れ -->
    <button th:unless="${product.stock > 0}" class="btn" disabled>在庫切れ</button>
  </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
