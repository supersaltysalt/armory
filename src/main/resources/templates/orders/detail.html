<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('注文詳細')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="page">
  <p><a th:href="@{/orders}">← 注文履歴へ戻る</a></p>
  <h1>注文詳細</h1>

  <dl class="info">
    <dt>注文番号</dt><dd th:text="${order.id}"></dd>
    <dt>注文日時</dt><dd th:text="${#temporals.format(order.orderedAt, 'yyyy/MM/dd HH:mm')}"></dd>
    <dt>状態</dt><dd th:text="${order.status == 'PAID'} ? '支払い済み' : ${order.status}"></dd>
  </dl>

  <table class="tbl">
    <thead>
      <tr><th>商品</th><th>単価（購入時）</th><th>数量</th><th>小計</th></tr>
    </thead>
    <tbody>
      <tr th:each="i : ${order.items}">
        <td th:text="${i.productName}"></td>
        <td th:text="'¥' + ${#numbers.formatInteger(i.unitPrice, 3, 'COMMA')}"></td>
        <td th:text="${i.quantity}"></td>
        <td th:text="'¥' + ${#numbers.formatInteger(i.unitPrice * i.quantity, 3, 'COMMA')}"></td>
      </tr>
    </tbody>
  </table>

  <div class="sum">
    合計：<b th:text="'¥' + ${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')}"></b>
  </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
